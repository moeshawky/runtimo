# ═══════════════════════════════════════════════════════════════════════════════
# MASTER: Publish to crates.io (ix / sniper / llmosafe / runtimo)
# ═══════════════════════════════════════════════════════════════════════════════
# Canonical source: /workspace/.github/workflows/publish-cratesio.yml
# Reference:        /workspace/PUBLISHING.md
#
# REQUIRED REPO SECRET: CRATES_IO (from crates.io Account Settings)
# REQUIRED: The crate must already exist on crates.io (first publish is manual)
#
# RUNTIMO DIVERGENCE (one tool, one repo — AGENTS.md): cli, core, and daemon
# are a single program at a single workspace version. They publish together
# in dependency order. Each downstream crate verifies against the live index,
# so dry-run AND publish interleave per crate: a downstream dry-run cannot
# pass until its upstream version is actually on crates.io. Do NOT regroup
# into dry-run-all / publish-all — run 34267676335 proved that fails.
# ═══════════════════════════════════════════════════════════════════════════════

name: Publish to crates.io

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  PROJECT: runtimo                          # ← CHANGE: ix | sniper | llmosafe | runtimo

jobs:
  # ── Gate: verify token exists ────────────────────────────────────────────
  check-token:
    runs-on: ubuntu-latest
    outputs:
      has-token: ${{ steps.check.outputs.has-token }}
    steps:
      - id: check
        run: |
          if [[ -n "${{ secrets.CRATES_IO }}" ]]; then
            echo "has-token=true" >> "$GITHUB_OUTPUT"
            echo "✅ CRATES_IO is configured"
          else
            echo "::error::CRATES_IO secret is not configured for this repo"
            echo "has-token=false" >> "$GITHUB_OUTPUT"
            echo "❌ Set CRATES_IO in repo Settings > Secrets > Actions"
          fi

  # ── Crate 1/3: runtimo-core (no workspace deps) ──────────────────────────
  publish-core:
    needs: check-token
    if: needs.check-token.outputs.has-token == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Dry-run runtimo-core
        run: cargo publish -p runtimo-core --dry-run --locked

      - name: Publish runtimo-core (skip if version on index)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO }}
        run: |
          VERSION=$(grep '^version = ' Cargo.toml | head -1 | cut -d'"' -f2)
          if cargo search runtimo-core --limit 1 2>/dev/null | grep -q "^runtimo-core = \"$VERSION\""; then
            echo "── runtimo-core $VERSION already on crates.io, skipping ──"
          else
            cargo publish -p runtimo-core --locked
          fi

  # ── Crate 2/3: runtimo-daemon (needs runtimo-core live) ──────────────────
  publish-daemon:
    needs: publish-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Dry-run runtimo-daemon
        run: cargo publish -p runtimo-daemon --dry-run --locked

      - name: Publish runtimo-daemon (skip if version on index)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO }}
        run: |
          VERSION=$(grep '^version = ' Cargo.toml | head -1 | cut -d'"' -f2)
          if cargo search runtimo-daemon --limit 1 2>/dev/null | grep -q "^runtimo-daemon = \"$VERSION\""; then
            echo "── runtimo-daemon $VERSION already on crates.io, skipping ──"
          else
            cargo publish -p runtimo-daemon --locked
          fi

  # ── Crate 3/3: runtimo-cli (needs daemon + core live) ────────────────────
  publish-cli:
    needs: publish-daemon
    runs-on: ubuntu-latest
    environment:
      name: cratesio
      url: https://crates.io/crates/runtimo-cli
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Dry-run runtimo-cli
        run: cargo publish -p runtimo-cli --dry-run --locked

      - name: Publish runtimo-cli (skip if version on index)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO }}
        run: |
          VERSION=$(grep '^version = ' Cargo.toml | head -1 | cut -d'"' -f2)
          if cargo search runtimo-cli --limit 1 2>/dev/null | grep -q "^runtimo-cli = \"$VERSION\""; then
            echo "── runtimo-cli $VERSION already on crates.io, skipping ──"
          else
            cargo publish -p runtimo-cli --locked
          fi
