# ═══════════════════════════════════════════════════════════════════════════════
# MASTER: Publish to crates.io (ix / sniper / llmosafe / runtimo)
# ═══════════════════════════════════════════════════════════════════════════════
# Canonical source: /workspace/.github/workflows/publish-cratesio.yml
# Reference:        /workspace/PUBLISHING.md
#
# REQUIRED REPO SECRET: CRATES_IO (from crates.io Account Settings)
# REQUIRED: The crate must already exist on crates.io (first publish is manual)
#
# RUNTIMO DIVERGENCE (one tool, one repo — AGENTS.md): cli, core, and daemon
# are a single program at a single workspace version. They publish together,
# in dependency order, from the CRATES list below. PROJECT stays for the
# environment URL; PUBLISH_FLAGS is retired on this copy (ordered multi-crate
# publish replaces the single `-p` flag).
# ═══════════════════════════════════════════════════════════════════════════════

name: Publish to crates.io

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  PROJECT: runtimo                          # ← CHANGE: ix | sniper | llmosafe | runtimo
  CRATES: "runtimo-core runtimo-daemon runtimo-cli"   # dependency order, space-separated

jobs:
  # ── Gate: verify token exists ────────────────────────────────────────────
  check-token:
    runs-on: ubuntu-latest
    outputs:
      has-token: ${{ steps.check.outputs.has-token }}
    steps:
      - id: check
        run: |
          if [[ -n "${{ secrets.CRATES_IO }}" ]]; then
            echo "has-token=true" >> "$GITHUB_OUTPUT"
            echo "✅ CRATES_IO is configured"
          else
            echo "::error::CRATES_IO secret is not configured for this repo"
            echo "has-token=false" >> "$GITHUB_OUTPUT"
            echo "❌ Set CRATES_IO in repo Settings > Secrets > Actions"
          fi

  # ── Dry-run: verify every crate can be published ────────────────────────
  dry-run:
    needs: check-token
    if: needs.check-token.outputs.has-token == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: cargo publish --dry-run (all crates, dependency order)
        run: |
          for crate in ${{ env.CRATES }}; do
            echo "── dry-run $crate ──"
            cargo publish -p "$crate" --dry-run --locked
          done

  # ── Publish (dependency order; skips versions already on the index) ─────
  publish:
    needs: dry-run
    runs-on: ubuntu-latest
    environment:
      name: cratesio
      url: https://crates.io/crates/runtimo-cli
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Publish to crates.io (runtimo-core → runtimo-daemon → runtimo-cli)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO }}
        run: |
          VERSION=$(grep '^version = ' Cargo.toml | head -1 | cut -d'"' -f2)
          echo "Workspace version: $VERSION"
          for crate in ${{ env.CRATES }}; do
            if cargo search "$crate" --limit 1 2>/dev/null | grep -q "^$crate = \"$VERSION\""; then
              echo "── $crate $VERSION already on crates.io, skipping ──"
            else
              echo "── publishing $crate $VERSION ──"
              cargo publish -p "$crate" --locked
            fi
          done
