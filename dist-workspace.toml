[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.31.0"
# CI backends to support
ci = "github"
# The installers to generate for each app (Linux-only: shell)
installers = ["shell"]
# Target platforms to build apps for (Rust target-triple syntax)
# Linux-only runtime: ubuntu-latest runners (AGENTS.md — /proc, ps, df shell-outs)
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-gnu",
]
# Which actions to run on pull requests
pr-run-mode = "plan"
# Whether to install an updater program
install-updater = false
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Allow dirty CI (don't fail on out-of-date workflow)
allow-dirty = ["ci"]

# Custom runner mappings for GitHub free tier
[dist.github-custom-runners]
# Linux x64 — native on ubuntu-latest
"x86_64-unknown-linux-gnu" = "ubuntu-latest"
# Linux musl — native on ubuntu-latest
"x86_64-unknown-linux-musl" = "ubuntu-latest"
# Linux ARM — cross-compile from ubuntu-latest (zig is auto-detected)
"aarch64-unknown-linux-gnu" = "ubuntu-latest"
